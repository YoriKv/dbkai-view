[project]
name = "dbkai"
# Single-sourced from app/dbkai/__init__.py (__version__), so a release bumps
# exactly one file. See [tool.hatch.version] below.
dynamic = ["version"]
description = "A model extractor and viewer for DB Kai: Ultimate Butoden"
readme = "README.md"
requires-python = ">=3.12"
# The SPDX-expression form of `license` plus `license-files` is PEP 639, which
# needs hatchling >= 1.27 — the unpinned build requirement below resolves to a
# newer one than that.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Matrices for skinning and forward kinematics, on the headless side too.
    "numpy>=2.5.3",
    # The viewport draws through OpenGL 3.3 core; PyOpenGL is BSD-licensed.
    "pyopengl>=3.1.10",
    # The viewer's UI toolkit. Qt 6 via PySide6 for its LGPLv3 license, and it
    # ships wheels for Windows, macOS and Linux.
    #
    # Only `dbkai.ui` and `dbkai.app` may import it: the extractor side stays
    # Qt-free so it runs headless, in scripts and in tests.
    "PySide6>=6.8",
]

[project.scripts]
# `uv run dbkai` from anywhere in the repository; also `python -m dbkai`.
dbkai = "dbkai.app:main"

[dependency-groups]
# uv-native dev dependencies (PEP 735). Not shipped in the built wheel.
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    # Runs the suite across processes. See `-n` in [tool.pytest.ini_options].
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Read __version__ straight from the package so pyproject and the runtime agree.
path = "app/dbkai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app/dbkai"]

[tool.uv]
# The Windows venv is written by Windows uv into the WSL filesystem, so uv's
# cache and the venv sit on different filesystems and hardlinking fails —
# uv warns and falls back to copying. Ask for copy up front to silence that;
# the cost is a one-time per-install copy.
link-mode = "copy"

[tool.ruff]
line-length = 88
target-version = "py312"
# The package root. Without it ruff's import sorter cannot tell `dbkai` from a
# third-party package, and sorts it into the wrong block.
src = ["app"]
# One line per finding, no echoed source.
output-format = "concise"

[tool.ruff.lint]
# A pragmatic modern default: pyflakes/pycodestyle errors, import sorting,
# pyupgrade, and bugbear. W605 is the one `W` rule taken: an invalid escape in
# a docstring is a SyntaxWarning on whichever interpreter next compiles it.
select = ["E", "F", "I", "UP", "B", "W605"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
# Qt tests must never try to open a real window: `offscreen` is forced in
# app/tests/conftest.py before Qt is imported.
#
# `-n` runs the suite in parallel; `-n0` runs everything in this process again,
# which is what `-s`, a `pdb` breakpoint and a readable traceback all need.
addopts = "-ra -n auto --maxprocesses=8"
